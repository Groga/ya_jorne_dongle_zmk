targets:
  - name: jorne_dongle
    board: nice_nano_v2
    shield: jorne_dongle

  - name: jorne_left_peripheral
    board: nice_nano_v2
    shield: jorne_left
    extra_kconfig: CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  - name: jorne_right_peripheral
    board: nice_nano_v2
    shield: jorne_right
    extra_kconfig: CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  - name: settings_reset
    board: nice_nano_v2
    shield: jorne_dongle
    extra_kconfig: CONFIG_ZMK_SETTINGS_RESET_ON_BOOT=y

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Отладочное логирование отключено 2026-09-03 (Evgeniy Moskovkin) — раскладка
# отлажена, лог по USB больше не нужен (снижал автономность и скорость скана).
# Чтобы снова снять лог: вернуть CONFIG_LOG=y и CONFIG_ZMK_LOG_LEVEL_DBG=y
# и собрать со snippet: zmk-usb-logging.

# добавлено 2026-09-03 (Evgeniy Moskovkin)
# У nRF52840 два пина по умолчанию отданы под NFC-антенну, а не под обычный
# GPIO: P0.09 (= pro_micro D10) и P0.10 (= pro_micro D16).
#
# История: сначала опцию добавили из-за P0.09 - думали, что на нём висит
# COL 5. Это НЕ помогло, и позже выяснилось почему: COL 4 был прописан на
# P0.28, которого на разъёме nice!nano вообще не существует, а P0.09 тоже
# оказался не тем пином. См. jorne_left.overlay v5.0.
#
# Опция ОСТАЁТСЯ НУЖНОЙ: в v5.0 COL 4 = pro_micro D16 = P0.10, то есть
# второй NFC-пин. Без этой строки колонка R/G/B работать не будет.
CONFIG_NFCT_PINS_AS_GPIOS=y

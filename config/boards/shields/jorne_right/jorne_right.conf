CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Отладочное логирование отключено 2026-09-03 (Evgeniy Moskovkin) — раскладка
# отлажена, лог по USB больше не нужен (снижал автономность и скорость скана).
# Чтобы снова снять лог: вернуть CONFIG_LOG=y и CONFIG_ZMK_LOG_LEVEL_DBG=y
# и собрать со snippet: zmk-usb-logging.

# добавлено 2026-09-03 (Evgeniy Moskovkin)
# COL 5 правой половины = pro_micro 16 = P0.10 = второй NFC-пин nRF52840.
# На нём висит клавиша [ (LBKT). Подтверждено логом: в верхнем ряду
# локальный столбец 5 не срабатывал ([ была мертва), тогда как остальные
# столбцы работали. Опция включает P0.10 как обычный GPIO. Аналогично
# левой половине (там по той же причине включён P0.10 в COL 4).
CONFIG_NFCT_PINS_AS_GPIOS=y
